[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-service"
version = "0.1.0"
description = "Focused patent retrieval service for EP/WO publications and PCT international applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "defusedxml>=0.7.1,<1.0.0",
  "img2pdf>=0.6.1,<1.0.0",
  "onnxruntime>=1.22.0,<2.0.0",
  "opencv-python>=4.10.0,<5.0.0",
  "Pillow>=11.0.0,<13.0.0",
  "PyMuPDF>=1.26.0,<2.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "pytesseract>=0.3.13,<1.0.0",
  "rapidocr>=3.9.2,<4.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "zeep>=4.3.1,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
